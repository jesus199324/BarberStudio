spring:
  application:
    name: barber-studio-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barberstudio}
    username: ${DB_USER:barber}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # el esquema lo manejan SOLO las migraciones Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # IP real del cliente detras de un proxy (rate limiting)

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}   # CORS + verificacion de Origin
  rate-limit:
    enabled: true                       # se desactiva solo en pruebas
  jwt:
    secret: ${JWT_SECRET:}              # minimo 32 caracteres; sin valor la app no arranca
    expiration-minutes: 120
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}
  storage:
    provider: ${STORAGE_PROVIDER:local}   # local (desarrollo) | cloudinary (produccion)
    local-dir: ${UPLOAD_DIR:./uploads}
    public-base-url: ${PUBLIC_BASE_URL:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
