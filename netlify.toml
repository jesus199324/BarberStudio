[build]
  publish = "frontend"

# Reemplazá TU-BACKEND por la URL real de Render (ver docs/DEPLOY.md).
# Con este proxy el navegador habla siempre con Netlify (mismo origen): sin problemas de CORS ni de cookies.
[[redirects]]
  from = "/api/*"
  to = "https://TU-BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://TU-BACKEND.onrender.com/uploads/:splat"
  status = 200
  force = true
