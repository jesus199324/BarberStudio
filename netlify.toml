[build]
  publish = "frontend"

# Reemplazá TU-BACKEND por la URL real de Render (ver docs/DEPLOY.md).
# Con este proxy el navegador habla siempre con Netlify (mismo origen): sin problemas de CORS ni de cookies.
[[redirects]]
  from = "/api/*"
  to = "barber-studio-api.onrender.com"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "barber-studio-api.onrender.com"
  status = 200
  force = true
