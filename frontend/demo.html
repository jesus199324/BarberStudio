<body>
<div id="app"></div><dialog id="dlg"></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
const TZ='America/Montevideo',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=t=>new Date(t).toLocaleTimeString('es-UY',{hour:'2-digit',minute:'2-digit',timeZone:TZ});
const money=n=>'$ '+Number(n).toLocaleString('es-UY');
const at=(h,m,dd)=>{const d=new Date();d.setDate(d.getDate()+(dd||0));d.setHours(h,m||0,0,0);return d.getTime()};
const sameDay=t=>new Date(t).toDateString()===new Date().toDateString();
const LBL={PENDING:'Pendiente',CONFIRMED:'Confirmado',COMPLETED:'Completado',CANCELLED:'Cancelado'};
function phone(raw){const s=(raw||'').trim(),d=s.replace(/\D/g,'');let e;
 if(s.startsWith('+'))e='+'+d;else if(d.startsWith('00'))e='+'+d.slice(2);else if(d.startsWith('598'))e='+'+d;
 else if(d.startsWith('09')&&d.length==9)e='+598'+d.slice(1);else if(d.startsWith('9')&&d.length==8)e='+598'+d;else e='+'+d;
 if(!/^\+[1-9]\d{7,14}$/.test(e))throw new Error('El WhatsApp no es válido. Probá con +59899123456.');return e}
let seq=100;
const S={shop:{name:'jesuss.sk8',wa:'+59899119628'},
 services:[[1,'Corte clásico',600,30],[2,'Taper fade',700,45],[3,'Arreglo de barba',400,20],[4,'Corte + barba',950,60],[5,'Corte infantil',500,30]].map(([id,name,price,min])=>({id,name,price,min})),
 styles:['Taper fade','Low fade','Mid fade','High fade','Mohicano','Corte clásico','Crop','Cortes con rulos','Cortes infantiles'].map((name,i)=>({id:i+1,name})),
 items:[[1,'Taper fade clásico',1,1,212],[2,'Low fade con textura',2,1,12],[3,'Mid fade prolijo',3,1,200],[4,'High fade marcado',4,1,350],[5,'Mohicano moderno',5,1,30],[6,'Rulos definidos',8,1,280],[7,'Corte infantil',9,1,150],[8,'Crop (borrador)',7,0,60]].map(([id,t,sid,pub,h])=>({id,t,sid,pub:!!pub,h})),
 clients:[[1,'Cliente Demo Uno','+59899100001'],[2,'Cliente Demo Dos','+59899100002'],[3,'Cliente Demo Tres','+59899100003'],[4,'Cliente Demo Cuatro','+59899100004'],[5,'Cliente Demo Cinco','+59899100005']].map(([id,name,ph])=>({id,name,ph})),
 appts:[],visits:[],reqs:[{id:90,name:'Solicitante Demo',ph:'+59899100099',sid:2,msg:'Quiero un low fade parecido al de la galería.',pref:'Sábado a la mañana',st:'NEW'}]};
const svc=id=>S.services.find(x=>x.id==id),cli=id=>S.clients.find(x=>x.id==id),sty=id=>S.styles.find(x=>x.id==id);
const busy=(s,e)=>S.appts.some(a=>a.st!=='CANCELLED'&&a.start<e&&a.end>s);
function addAppt(cid,sid,start,st){const v=svc(sid),end=start+v.min*60000;
 if(busy(start,end))throw new Error('Ese horario se superpone con otro turno.');
 const a={id:++seq,cid:+cid,sid:+sid,start,end,price:v.price,st:st||'CONFIRMED'};S.appts.push(a);return a}
function complete(id){const a=S.appts.find(x=>x.id===id),ex=S.visits.find(v=>v.aid===id);
 if(a.st==='COMPLETED')return ex;
 if(a.st==='CANCELLED')throw new Error('Un turno cancelado no puede completarse.');
 if(a.st!=='CONFIRMED')throw new Error('Confirmá el turno antes de completarlo.');
 const v={id:++seq,aid:id,cid:a.cid,at:a.start,svc:svc(a.sid).name,price:a.price};S.visits.push(v);a.st='COMPLETED';return v}
S.appts=[];
[[1,2,at(15,0,-1),'CONFIRMED'],[2,1,at(16,0,-1),'CONFIRMED'],[3,4,at(10,0),'CONFIRMED'],[4,3,at(12,0),'PENDING'],[5,2,at(15,30),'CONFIRMED']].forEach(([c,s,t,st])=>addAppt(c,s,t,st));
complete(S.appts[0].id);S.appts[1].st='CANCELLED';
const V={mode:'public',tab:'hoy',admin:false,s:'',q:'',fav:new Set(),est:new Set(),qz:{step:0,ans:[]},day:null,time:null,list:[]};
const wa=t=>'https://wa.me/'+S.shop.wa.slice(1)+'?text='+encodeURIComponent(t);
const toast=(m,bad)=>{const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';clearTimeout(toast.k);toast.k=setTimeout(()=>t.textContent='',3500)};
const dlg=$('#dlg'),dopen=h=>{dlg.innerHTML=h;if(!dlg.open)dlg.showModal()};
let pending=null;
const ask=(m,fn)=>{pending=fn;dopen(`<h2>${esc(m)}</h2><p class=mu>Esta acción no se puede deshacer.</p><div class=row><button class=btn data-a=yes>Sí, continuar</button><button class="btn ghost" data-a=close>Volver</button></div>`)};

function render(){
 $('#app').innerHTML=`<div class=note>Vista previa con datos simulados que viven en este navegador. La aplicación real (Spring Boot + PostgreSQL) corre en tu equipo; esto muestra el diseño y las reglas de negocio.</div>
 <header class=bar><span class=brand>jesuss.sk8</span><nav aria-label="Vista"><button class="chip" data-a=mode data-v=public aria-pressed="${V.mode==='public'}">Sitio público</button><button class="chip" data-a=mode data-v=panel aria-pressed="${V.mode==='panel'}">Panel de gestión</button><button class=chip data-a=theme aria-label="Cambiar de tema: blanco, azul o neón">Tema: ${TN[document.documentElement.dataset.theme]||'Auto'}</button></nav></header>
 <main>${V.mode==='public'?pub():panel()}</main><footer>Contenido de demostración: no hay clientes, reseñas ni fotos reales. <a href="https://www.instagram.com/jesuss.sk8/" target=_blank rel=noopener style="color:inherit">Instagram @jesuss.sk8</a></footer>`;
 if(V.mode==='public'){drawGallery();drawQz();drawEst();drawSlots()}if(V.mode==='panel'&&V.admin){countUp();if(V.tab==='clientes')drawClients()}}

function pub(){
 const sv=S.services.map(s=>`<li><button data-a=est data-id=${s.id} aria-pressed="${V.est.has(s.id)}"><span>${esc(s.name)}</span><span class=dots></span><b>${money(s.price)}</b><small>${s.min} min</small></button></li>`).join('');
 const so=S.styles.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
 const io=S.items.filter(i=>i.pub).map(i=>`<option value="${i.id}">${esc(i.t)}</option>`).join('');
 return `<div class=pole></div>
 <section class=hero><h1>Cortes que se notan.</h1><p>Barbería de Jesus Albornoz. Degradés, clásicos y rulos trabajados con calma. Mirá el portfolio, elegí uno y pedí tu turno por WhatsApp.</p>
 <div class=row><a class=btn href="#quiz">Encontrá tu corte</a><a class="btn ghost" href="#galeria">Ver los cortes</a><a class="btn wa" target=_blank rel=noopener href="${wa('Hola, quisiera consultar por un turno.')}">Consultar por WhatsApp</a></div></section>
 <section id=quiz><h2>Encontrá tu corte</h2><div class=qz id=qz></div></section>
 <section id=servicios><h2>Armá tu combo</h2><ul class=svc>${sv}</ul><div id=est aria-live=polite></div></section>
 <section id=galeria><h2>Portfolio de cortes</h2>
 <div class=row><input id=q type=search placeholder="Buscar por nombre" aria-label="Buscar corte" style="max-width:260px"><button class="btn ghost" data-a=reset>Restablecer filtros</button></div>
 <div id=chips class=row style="margin-top:10px" role=group aria-label="Filtrar por estilo"></div><div id=grid class=grid></div></section>
 <section id=solicitud><h2>Pedí tu corte</h2><p class=mu style="max-width:52ch">Tu solicitud no es una reserva: el barbero la revisa y te confirma el horario.</p>
 <form data-f=req class=stack novalidate>
 <label>Nombre<input name=name autocomplete=name><small class=err id=e-name></small></label>
 <label>WhatsApp<input name=whatsapp inputmode=tel autocomplete=tel placeholder="099 123 456"><small class=err id=e-whatsapp></small></label>
 <label>Estilo de corte<select name=style><option value="">Sin preferencia</option>${so}</select></label>
 <label>Corte del portfolio<select name=item id=rp><option value="">Ninguno</option>${io}</select></label>
 <label>Detalles<textarea name=message rows=3 maxlength=1000></textarea></label>
 <div style="margin-bottom:12px"><b>Horario preferido (opcional)</b><div id=slots></div><input type=hidden name=pref id=pref></div>
 <input class=hp name=website tabindex=-1 autocomplete=off aria-hidden=true>
 <button class=btn>Enviar solicitud</button></form><div id=reqOut aria-live=polite></div></section>`}

const card=i=>`<div class=cw><button class=heart data-a=fav data-id=${i.id} aria-pressed="${V.fav.has(i.id)}" aria-label="Favorito: ${esc(i.t)}">♥</button><button class=card data-a=open data-id=${i.id}><div class=ph style="--h:${i.h}" role=img aria-label="Foto de demostración: ${esc(i.t)}">Foto de demostración</div><div class=cap><b>${esc(i.t)}</b><small>${esc(sty(i.sid).name)}</small></div></button></div>`;
function drawGallery(){
 $('#chips').innerHTML=[['','Todos'],['fav','♥ Favoritos ('+V.fav.size+')'],...S.styles.map(s=>[s.id,s.name])].map(([v,l])=>`<button class=chip data-a=sty data-v="${v}" aria-pressed="${String(V.s)===String(v)}">${esc(l)}</button>`).join('');
 const q=V.q.trim().toLowerCase(),list=S.items.filter(i=>i.pub&&(!V.s||(V.s==='fav'?V.fav.has(i.id):i.sid==V.s))&&i.t.toLowerCase().includes(q));
 V.list=list;$('#grid').innerHTML=list.length?list.map(card).join(''):`<p class=mu>No hay cortes con esos filtros. Probá con otro estilo o restablecé la búsqueda.</p>`}
function openItem(id){const i=S.items.find(x=>x.id===id);
 dopen(`<div class=ph style="--h:${i.h};aspect-ratio:4/3" role=img aria-label="Foto de demostración: ${esc(i.t)}">Foto de demostración</div><h2>${esc(i.t)}</h2><p class=mu>${esc(sty(i.sid).name)}</p><p>Ejemplo de demostración. Acá va la descripción del trabajo.</p>
 <div class=row><a class="btn wa" target=_blank rel=noopener href="${wa(`Hola, vi el corte ${i.t} en tu portfolio y me gustaría consultar disponibilidad para hacerme uno.`)}">Consultar por este estilo</a><button class=btn data-a=req data-id=${i.id}>Pedir este corte</button><button class="btn ghost" data-a=nav data-d=-1 data-id=${i.id} aria-label="Corte anterior">‹</button><button class="btn ghost" data-a=nav data-d=1 data-id=${i.id} aria-label="Corte siguiente">›</button><button class="btn ghost" data-a=close>Cerrar</button></div><p class=mu><small>Tip: con las flechas ← → del teclado pasás al siguiente corte.</small></p>`)}

function panel(){
 if(!V.admin)return `<section><h2>Panel de gestión</h2><p class=mu>Usuario de demostración ya completado.</p>
 <form data-f=login class=stack><label>Email<input name=email value="demo@barberstudio.test" autocomplete=username></label>
 <label>Contraseña<input name=password type=password value="demo1234" autocomplete=current-password></label><small class=err id=e-login></small><button class=btn>Ingresar</button></form></section>`;
 const nr=S.reqs.filter(r=>r.st==='NEW').length;
 const tabs=[['hoy','Hoy'],['clientes','Clientes'],['solicitudes','Solicitudes'],['portfolio','Portfolio']];
 return `<div class=pole style="margin-top:-1px"></div><div class=tabs role=tablist>${tabs.map(([k,l])=>`<button class=chip data-a=tab data-v=${k} aria-pressed="${V.tab===k}">${l}${k==='solicitudes'&&nr?`<b>${nr}</b>`:''}</button>`).join('')}<button class="chip" data-a=logout style="margin-left:auto">Cerrar sesión</button></div>${P[V.tab]()}`}

const P={
hoy(){const today=S.appts.filter(a=>sameDay(a.start)).sort((a,b)=>a.start-b.start),vt=S.visits.filter(v=>sameDay(v.at));
 const inc=vt.reduce((s,v)=>s+v.price,0),pend=S.appts.filter(a=>a.st==='PENDING'&&a.end>Date.now()).length,canc=today.filter(a=>a.st==='CANCELLED').length,nr=S.reqs.filter(r=>r.st==='NEW').length;
 const k=(b,s,t)=>`<div class=kpi><b data-n="${String(b).replace(/\D/g,'')}" data-m="${String(b).startsWith('$')?1:0}">${b}</b>${s}${t?`<br><small>${t}</small>`:''}</div>`;
 const rows=today.map(a=>`<li><div class=tm>${hm(a.start)}<small>${(a.end-a.start)/60000} min</small></div><div class=gr><b>${esc(cli(a.cid).name)}</b><br><span class=mu>${esc(svc(a.sid).name)}, ${money(a.price)}</span></div><span class="bd ${a.st}">${LBL[a.st]}</span><div class=acts>${
 a.st==='PENDING'?`<button class="btn sm" data-a=conf data-id=${a.id}>Confirmar</button>`:''}${a.st==='CONFIRMED'?`<button class="btn sm" data-a=done data-id=${a.id}>Completar</button>`:''}${
 a.st==='PENDING'||a.st==='CONFIRMED'?`<button class="btn sm ghost" data-a=cancel data-id=${a.id}>Cancelar</button>`:''}</div></li>`).join('');
 const co=S.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''),so=S.services.map(s=>`<option value="${s.id}">${esc(s.name)}, ${money(s.price)}</option>`).join('');
 const n=new Date();n.setHours(n.getHours()+1,0,0,0);
 return `<div class=kpis>${k(money(inc),'Ingresos registrados hoy','Solo servicios completados y cobrados. No es ganancia neta.')}${k(vt.length,'Completados hoy')}${k(pend,'Por confirmar')}${k(canc,'Cancelados hoy')}${k(nr,'Solicitudes nuevas')}</div>
 <h2>Agenda de hoy</h2>${rows?`<ul class=list>${rows}</ul>`:`<p class=mu>No hay turnos para hoy. Agendá el primero abajo.</p>`}
 <h3 style="margin:26px 0 10px">Agendar turno</h3><form data-f=appt class=two><label>Cliente<select name=cid>${co}</select></label><label>Servicio<select name=sid>${so}</select></label>
 <label>Hora de hoy<input type=time name=time required value="${String(n.getHours()).padStart(2,'0')}:00"></label><button class=btn style="margin-bottom:12px">Agendar turno</button></form><small class=err id=e-appt></small>`},
clientes(){return `<div class=row style="margin-bottom:12px"><input id=cq type=search placeholder="Buscar por nombre o teléfono" aria-label="Buscar cliente" style="max-width:300px"></div><div id=clist></div>
 <h3 style="margin:26px 0 10px">Nuevo cliente</h3><form data-f=client class=two><label>Nombre<input name=name></label><label>WhatsApp<input name=whatsapp inputmode=tel placeholder="099 123 456"></label><button class=btn style="margin-bottom:12px">Guardar cliente</button></form><small class=err id=e-client></small>`},
solicitudes(){const so=S.services.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
 return S.reqs.length?`<div class=list>${S.reqs.map(r=>`<article><div class=gr><b>${esc(r.name)}</b> <span class=mu>${esc(r.ph)}</span><br>${r.sid?esc(sty(r.sid).name)+'. ':''}${esc(r.msg||'')}<br><span class=mu>Prefiere: ${esc(r.pref||'sin indicar')}</span></div>${
 r.st==='NEW'?`<select class=rs aria-label="Servicio">${so}</select><input class=rt type=time value="17:00" aria-label="Hora de hoy" style="width:auto"><button class="btn sm" data-a=acc data-id=${r.id}>Aceptar y agendar</button><button class="btn sm ghost" data-a=rej data-id=${r.id}>Rechazar</button>`:`<span class="bd ${r.st==='ACCEPTED'?'COMPLETED':'CANCELLED'}">${r.st==='ACCEPTED'?'Aceptada':'Rechazada'}</span>`}</article>`).join('')}</div>`:`<p class=mu>No hay solicitudes. Cuando alguien envíe el formulario público, aparece acá.</p>`},
portfolio(){return `<p class=mu>Los borradores nunca aparecen en la galería pública.</p><ul class=list style="margin-top:10px">${S.items.map(i=>`<li><div class=sw style="--h:${i.h}"></div><div class=gr><b>${esc(i.t)}</b><br><span class=mu>${esc(sty(i.sid).name)}</span></div><span class="bd ${i.pub?'on':''}">${i.pub?'Publicado':'Borrador'}</span><button class="btn sm ghost" data-a=pubtog data-id=${i.id}>${i.pub?'Despublicar':'Publicar'}</button></li>`).join('')}</ul>`}};

function drawClients(){const q=($('#cq')?.value||'').trim().toLowerCase(),d=q.replace(/\D/g,'');
 const l=S.clients.filter(c=>!q||c.name.toLowerCase().includes(q)||(d&&c.ph.includes(d)));
 $('#clist').innerHTML=l.length?`<div class=list>${l.map(c=>{const vs=S.visits.filter(v=>v.cid===c.id);
 return `<article><details><summary><b>${esc(c.name)}</b> <span class=mu>${esc(c.ph)}, ${vs.length} visitas, ${money(vs.reduce((s,v)=>s+v.price,0))}</span></summary><ul>${vs.length?vs.map(v=>`<li>${new Date(v.at).toLocaleDateString('es-UY')}: ${esc(v.svc)}, ${money(v.price)}</li>`).join(''):'<li>Todavía no tiene visitas registradas.</li>'}</ul></details></article>`}).join('')}</div>`:`<p class=mu>No encontramos clientes con esa búsqueda.</p>`}

const A={
 mode(d){V.mode=d.v;render();scrollTo(0,0)},sty(d){V.s=d.v;drawGallery()},
 reset(){V.s='';V.q='';const q=$('#q');if(q)q.value='';drawGallery()},
 open(d){openItem(+d.id)},close(){dlg.close()},yes(){dlg.close();pending&&pending();pending=null},
 req(d){dlg.close();$('#rp').value=d.id;$('#solicitud').scrollIntoView();$('#solicitud input').focus({preventScroll:true})},
 tab(d){V.tab=d.v;render()},logout(){V.admin=false;render()},
 conf(d){S.appts.find(a=>a.id==d.id).st='CONFIRMED';toast('Turno confirmado.');render()},
 cancel(d){ask('¿Cancelar este turno?',()=>{S.appts.find(a=>a.id==d.id).st='CANCELLED';toast('Turno cancelado. No genera ingresos.');render()})},
 done(d){try{const v=complete(+d.id);toast('Visita registrada: '+money(v.price));burst();render()}catch(e){toast(e.message,1)}},
 acc(d){const r=S.reqs.find(x=>x.id==d.id),box=document.activeElement.closest('article'),[h,m]=box.querySelector('.rt').value.split(':').map(Number);
  try{let c=S.clients.find(x=>x.ph===r.ph);if(!c)c={id:++seq,name:r.name,ph:r.ph};
   const a=addAppt(c.id,box.querySelector('.rs').value,at(h,m),'CONFIRMED');if(!S.clients.includes(c))S.clients.push(c);
   r.st='ACCEPTED';toast('Solicitud aceptada: turno creado a las '+hm(a.start)+'.');render()}catch(e){toast(e.message,1)}},
 rej(d){S.reqs.find(x=>x.id==d.id).st='REJECTED';toast('Solicitud rechazada.');render()},
 pubtog(d){const i=S.items.find(x=>x.id==d.id);i.pub=!i.pub;toast(i.pub?'Publicado en la galería.':'Pasó a borrador.');render()}};
const TN={light:'Blanco',dark:'Azul',street:'Neón'};
const QZ=[{q:'¿Cómo llevás el pelo?',o:[['Corto y prolijo',[1,2,3,6]],['Con contraste y marcado',[4,5,7]],['Natural, con volumen o rulos',[8,9,6]]]},{q:'¿Cuánto mantenimiento querés?',o:[['Poco: cada 4 a 6 semanas',[6,3,8]],['Cada 2 a 3 semanas',[1,2,3,4]],['Soy de cambiar seguido',[5,7,9]]]},{q:'¿Qué buscás con el corte?',o:[['Algo clásico y formal',[6,1]],['Moderno y urbano',[2,3,4,5]],['Cómodo para todos los días',[7,8,9]]]}];
function drawQz(){const z=V.qz,el=$('#qz');if(!el)return;
