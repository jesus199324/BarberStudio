<script>
  /* Sin parpadeos: se decide antes de pintar si corresponde mostrar la introduccion */
  (function () { var r = document.documentElement;
    try { var th = localStorage.getItem('theme'); if (th === 'shelby' || th === 'skate') r.setAttribute('data-theme', th); } catch (e) { /* ok */ }
    try { if (sessionStorage.getItem('intro') || matchMedia('(prefers-reduced-motion: reduce)').matches || location.hash.indexOf('panel') > -1) r.classList.add('no-intro'); else r.classList.add('intro-on'); }
    catch (e) { r.classList.add('intro-on'); } })();
</script>

<body>
<div id="intro" aria-hidden="true"></div>
<div id="app"></div><dialog id="dlg"></dialog><div id="toast" role="status" aria-live="polite"></div>
