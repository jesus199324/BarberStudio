services:
  db:
    image: postgres:16-alpine
    container_name: barberstudio-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barberstudio}
      POSTGRES_USER: ${POSTGRES_USER:-barber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barber_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barber} -d ${POSTGRES_DB:-barberstudio}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
